spring.datasource.url=jdbc:h2:file:./data/citydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=app_user
spring.datasource.password=secure_password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Начальный администратор
app.security.admin.email=admin@city.local
app.security.admin.password=Admin12345

app.jwt.secret=FedorFedorFedorFedorFedorFedorFe
app.jwt.access-expiration=900000
app.jwt.refresh-expiration=604800000